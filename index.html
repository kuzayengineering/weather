<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Weather Realm</title>
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Clean, ad-free weather built on National Weather Service data." />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" sizes="any" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="js/vendor/leaflet.css" />
  <script src="js/vendor/chart.umd.js"></script>
  <script src="js/vendor/leaflet.js"></script>
</head>
<body data-theme="dark">
  <header class="app-header">
    <img src="img/logo.png" alt="Weather Realm" class="app-logo" />
    <span id="location-label">Locating…</span>
  </header>

  <main>
    <section id="tab-home" class="tab-panel active"></section>
    <section id="tab-hourly" class="tab-panel"></section>
    <section id="tab-daily" class="tab-panel"></section>
    <section id="tab-maps" class="tab-panel"></section>
    <section id="tab-settings" class="tab-panel"></section>
  </main>

  <nav class="tab-bar">
    <button data-tab="home" class="active"><span class="tab-icon">🏠</span>Home</button>
    <button data-tab="hourly"><span class="tab-icon">🕐</span>Hourly</button>
    <button data-tab="daily"><span class="tab-icon">📅</span>Daily</button>
    <button data-tab="maps"><span class="tab-icon">🗺️</span>Maps</button>
    <button data-tab="settings"><span class="tab-icon">⚙️</span>Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
